name: tomza_kit
description: "Kit interno modular para funcionalidades reutilizables (auth, red, impresión, UI, utilidades)."

publish_to: "none"

version: 0.1.0

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.9"

dependencies:
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  intl: ^0.20.2
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.1
  image: ^4.5.4
  pdf: ^3.11.0
  printing: ^5.13.4
  provider: ^6.1.2
  permission_handler: ^12.0.0+1
  device_info_plus: ^12.4.0
  path_provider: ^2.1.3
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Como librería, no requiere configuración especial aquí de assets inicialmente.
  uses-material-design: true

  fonts:
    - family: RobotoMonoBold
      fonts:
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
