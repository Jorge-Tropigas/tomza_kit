name: tomza_kit
description: "Kit interno modular para funcionalidades reutilizables (auth, red, impresión, UI, utilidades)."

publish_to: "none"

version: 0.1.0

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.9"

dependencies:
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  intl: ^0.20.3
  google_fonts: ^9.0.0
  flutter_svg: ^2.3.0
  image: ^4.12.0
  pdf: ^3.13.1
  printing: ^5.15.1
  provider: ^6.1.5+1
  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0
  path_provider: ^2.1.6
  flutter_image_compress: ^2.5.1
  geolocator: ^14.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Como librería, no requiere configuración especial aquí de assets inicialmente.
  uses-material-design: true

  fonts:
    - family: RobotoMonoBold
      fonts:
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
